# Builds the site and publishes it to GitHub Pages on every push to main.
# Pull requests are checked by ci.yml instead.
#
# The Maps key comes from the GOOGLE_MAPS_API_KEY repository secret and ends up
# in the public bundle, which is how browser Maps keys work: its protection is
# the HTTP-referrer restriction set in Google Cloud, not secrecy (see README).
# Without the secret the site still deploys, and visitors bring their own key.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer push queues behind a running one rather
# than cancelling a half-finished deployment.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Repeated from ci.yml so that a red main cannot deploy, whatever order
      # the two workflows finish in.
      - run: bun run check
      - run: bun run build
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
